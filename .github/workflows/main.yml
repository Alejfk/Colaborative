name: Prueba

on: [push]

jobs:
  check-tokens:
    runs-on: self-hosted
    steps:
      - name: Diagnóstico de sistema
        run: |
          echo "Host real:"
          whoami
        shell: powershell

      - name: Validar tokens
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
              Write-Host "Tokens validados correctamente." -ForegroundColor Green
          } else {
              Write-Host "No coinciden." -ForegroundColor Red
              exit 1
          }
