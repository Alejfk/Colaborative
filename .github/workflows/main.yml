name: Prueba

on: [push]

jobs:
  check-tokens:
    runs-on: [self-hosted, windows]
    steps:
      - name: Validar tokens
        shell: cmd
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -ExecutionPolicy Bypass -Command "if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) { Write-Host 'Tokens validados correctamente.' -ForegroundColor Green } else { Write-Host 'No coinciden.' -ForegroundColor Red; exit 1 }"
